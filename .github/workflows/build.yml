# Builds Windows and Linux (Rust) and macOS (Swift, mac/) on every push; a v* tag also publishes
# them as a GitHub release. The asset names are what the apps' auto update downloads: keep them.
name: build

# the site (docs/) and the texts change nothing in the apps: no build for them (tags always build)
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["docs/**", "**.md", "LICENSE"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version from Cargo.toml (a tag must match it, or the update would loop)
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $v"; exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo test
      - run: cargo build --release
      - name: Package (program, devices/, locales/ at the top of the zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/jbl-headphones.exe dist/
          Copy-Item -Recurse devices, locales dist/
          Compress-Archive -Path dist/* -DestinationPath jbl-headphones-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: jbl-headphones-windows-x64.zip

  linux:
    needs: version
    strategy:
      matrix:
        include:
          # tar: the name the app updates from; deb: Debian's name for the architecture
          - { runner: ubuntu-22.04, tar: x64, deb: amd64 }
          - { runner: ubuntu-22.04-arm, tar: arm64, deb: arm64 }
    # 22.04: the oldest glibc still supported, so the binary also runs on older distros
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      # the arm runner's image may come without rustup
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build --release
      - name: Package (program, devices/, locales/ at the top of the archive)
        run: |
          mkdir dist && cp target/release/jbl-headphones dist/ && cp -r devices locales dist/
          tar -czf jbl-headphones-linux-${{ matrix.tar }}.tar.gz -C dist .
      - name: .deb (the program in /usr/lib/jbl-headphones, which it finds through the /usr/bin link)
        run: |
          pkg=deb/usr/lib/jbl-headphones
          mkdir -p "$pkg" deb/usr/bin deb/usr/share/applications deb/usr/share/icons/hicolor/scalable/apps deb/DEBIAN
          cp docs/logo.svg deb/usr/share/icons/hicolor/scalable/apps/openheadphones.svg
          cp -r dist/. "$pkg/"
          ln -s ../lib/jbl-headphones/jbl-headphones deb/usr/bin/jbl-headphones
          cat > deb/usr/share/applications/jbl-headphones.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=OpenHeadphones
          Comment=Battery, noise cancelling, equalizer and settings of JBL headphones
          Exec=jbl-headphones
          Icon=openheadphones
          Categories=AudioVideo;Audio;Settings;
          EOF
          cat > deb/DEBIAN/control <<EOF
          Package: jbl-headphones
          Version: ${{ needs.version.outputs.version }}
          Architecture: ${{ matrix.deb }}
          Maintainer: edsuuu <https://github.com/edsuuu>
          Depends: libdbus-1-3, bluez
          Section: sound
          Priority: optional
          Homepage: https://edsuuu.github.io/OpenHeadphones/
          Description: OpenHeadphones, a tray app for JBL headphones
           Battery, noise cancelling, ambient sound, equalizer, touch gestures and settings of
           JBL headphones. Independent project, not affiliated with JBL or Harman.
          EOF
          dpkg-deb --root-owner-group --build deb jbl-headphones-linux-${{ matrix.deb }}.deb
          dpkg-deb --info jbl-headphones-linux-${{ matrix.deb }}.deb
      - name: The installed .deb finds its data through the link
        run: |
          sudo apt-get install -y ./jbl-headphones-linux-${{ matrix.deb }}.deb
          test "$(readlink -f /usr/bin/jbl-headphones)" = /usr/lib/jbl-headphones/jbl-headphones
          test -d /usr/lib/jbl-headphones/devices && test -d /usr/lib/jbl-headphones/locales
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.tar }}
          path: |
            jbl-headphones-linux-${{ matrix.tar }}.tar.gz
            jbl-headphones-linux-${{ matrix.deb }}.deb

  mac:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenHeadphones.app (universal, ad-hoc signed) zipped
        run: bash mac/bundle.sh "${{ needs.version.outputs.version }}"
      - name: The bundle reports its version and passes its self-test on its own data
        run: |
          app="dist/OpenHeadphones.app/Contents/MacOS/jbl-headphones"
          test "$("$app" --version)" = "${{ needs.version.outputs.version }}"
          "$app" --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/jbl-headphones-mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes assets/*
