# Generated by tools/import_jbl_apk.py from JBL Headphones 5.38.2 (jbl_live_680nc.json,
# Live680NCControl). Do not edit: change the importer and run it again.

name = "JBL Live 680NC"
product_ids = [0x2160]
name_prefixes = ["JBL Live 680NC"]
noise_modes = ["anc", "ambient", "talk_thru", "off"]
adaptive_anc = true

# The settings tab, card by card in the JBL app's order (see the Tune Flex 2's rows).
settings = [
    # Smart Audio & Video: AAC, SBC, latency presets (product_list.json "smartAudioVideo")
    { name = "smart_audio", section = "audio", kind = "choice", register = "smart_switch", width = 2, options = [
        { name = "normal", values = [197, 46, 130, 230] },
        { name = "audio", values = [256, 53, 130, 230] },
        { name = "video", values = [197, 46, 100, 200] },
    ] },
    # [on, type]; picking a type turns it on, like the app
    { name = "spatial", section = "audio", kind = "switch", register = { feature = 0x0C } },
    { name = "spatial_mode", section = "audio", kind = "choice", register = { feature = 0x0C }, byte = 1, set = [[0, 1]], when = "spatial", options = [
        { name = "movie", values = [1] },
        { name = "music", values = [2] },
        { name = "game", values = [3] },
    ] },
    { name = "safe_sound", section = "audio", kind = "switch", register = { feature = 0x20 } },
    # the hearing test itself runs in the phone app; here only on/off
    { name = "personi_fi", section = "audio", kind = "switch", register = "personi_fi" },
    # [on, level 1…3]
    { name = "voice_aware", section = "calls", kind = "switch", register = { feature = 0x0D } },
    { name = "voice_aware_level", section = "calls", kind = "choice", register = { feature = 0x0D }, byte = 1, when = "voice_aware", options = [
        { name = "low", values = [1] },
        { name = "mid", values = [2] },
        { name = "high", values = [3] },
    ] },
    # sound effect [status, type]: the app always sends status 1 (product_list.json "mEffectList")
    { name = "caller_voice", section = "calls", kind = "choice", register = { feature = 0x14 }, byte = 1, set = [[0, 1]], options = [
        { name = "natural", values = [0] },
        { name = "treble", values = [1] },
        { name = "bass", values = [2] },
    ] },
    # mic [on, gain, effect]: the app always sends on 1, gain 0xFF
    { name = "my_voice", section = "calls", kind = "choice", register = { feature = 0x16 }, byte = 2, set = [[0, 1], [1, 255]], options = [
        { name = "natural", values = [0] },
        { name = "powerful", values = [1] },
        { name = "bright", values = [2] },
    ] },
    { name = "audio_limiter", section = "calls", kind = "switch", register = { feature = 0x23 } },
    { name = "voice_prompts", section = "device", kind = "switch", register = "voice_prompt" },
    # [on, minutes u16 little-endian]
    { name = "auto_off", section = "device", kind = "switch", register = { feature = 0x0B } },
    { name = "auto_off_time", section = "device", kind = "choice", register = { feature = 0x0B }, byte = 1, width = 2, when = "auto_off", options = [
        { name = "min30", values = [30] },
        { name = "min60", values = [60] },
        { name = "min120", values = [120] },
    ] },
    { name = "firmware", section = "about", kind = "info", register = { feature = 0x05 }, format = "version" },
    { name = "factory_reset", section = "about", kind = "button", command = "factory_reset" },
]
# JBL cards this app has no row for yet: AutoCompensationCard, AscStatusCard, AuracastCard, AutoPlayPauseCard, SmartCaseSettingCard, ControlCard, LeAudioCard, HiResAudioCard, LeftRightBalance2Card, RelaxSoundCard, CaseCard

[images]
default = "black.png"
colors = { 0 = "black.png", 1 = "white.png", 2 = "blue.png" }

[eq]
max_db = 6.0
bands = [32, 64, 125, 250, 500, 1000, 2000, 4000, 8000, 16000]
# standard_preset_eq.json, group "live"; category = what the device gets
presets = [
    { name = "studio", category = 7, gains = [-2, -1, -1, -0.5, 0, 0, 0, 0, 0, 0] },
    { name = "bass", category = 3, gains = [4, 4, 3, 2.5, 0.5, 0, 0, 0, 0, 0] },
    { name = "club", category = 6, gains = [2, 1.5, 1, 0, 0, 0, 0, 1, 1, 2] },
    { name = "extreme_bass", category = 9, gains = [4, 4.5, 4.5, 3.5, -1, 0, 0, 2, 2, 0] },
    { name = "vocal", category = 2, gains = [-1.5, -3, -3, 1, 3.5, 3.5, 3, 1.5, 0, -1.5] },
    { name = "jazz", category = 1, gains = [4, 3, 1, 2.5, -1.5, -1.5, 0, 1, 3, 4] },
]
