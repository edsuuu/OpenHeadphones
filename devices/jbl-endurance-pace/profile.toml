# Generated by tools/import_jbl_apk.py from JBL Headphones 5.38.2 (jbl_endurance_pace.json,
# EndurancePaceControl). Do not edit: change the importer and run it again.

name = "JBL Endurance Pace"
product_ids = [0x2150]
name_prefixes = ["JBL Endurance Pace"]

# The settings tab, card by card in the JBL app's order (see the Tune Flex 2's rows).
settings = [
    # Smart Audio & Video: AAC, SBC, latency presets (product_list.json "smartAudioVideo")
    { name = "smart_audio", section = "audio", kind = "choice", register = "smart_switch", width = 2, options = [
        { name = "normal", values = [197, 46, 150] },
        { name = "audio", values = [256, 46, 150] },
        { name = "video", values = [197, 46, 120] },
    ] },
    # [on, level]: 84…116, 100 = center
    { name = "balance", section = "audio", kind = "switch", register = "balance" },
    { name = "balance_level", section = "audio", kind = "level", register = "balance", byte = 1, min = 84, max = 116, center = 100, set = [[0, 1]], when = "balance" },
    { name = "voice_prompts", section = "device", kind = "switch", register = "voice_prompt" },
    # [on, minutes u16 little-endian]
    { name = "auto_off", section = "device", kind = "switch", register = { feature = 0x0B } },
    { name = "auto_off_time", section = "device", kind = "choice", register = { feature = 0x0B }, byte = 1, width = 2, when = "auto_off", options = [
        { name = "min30", values = [30] },
        { name = "min60", values = [60] },
        { name = "min120", values = [120] },
    ] },
    { name = "firmware", section = "about", kind = "info", register = { feature = 0x05 }, format = "version" },
    { name = "factory_reset", section = "about", kind = "button", command = "factory_reset" },
]
# JBL cards this app has no row for yet: RelaxSoundCard, PulseDryCard, JBLBotteomCard

[images]
default = "jbl-endurance-pace-2150-blackgray.png"

[eq]
max_db = 6.0
bands = [32, 64, 125, 250, 500, 1000, 2000, 4000, 8000, 16000]
# standard_preset_eq.json, group "endurance"; category = what the device gets
presets = [
    { name = "bass", category = 3, gains = [4, 4, 3, 2.5, 0.5, 0, 0, 0, 0, 0] },
    { name = "extreme_bass", category = 9, gains = [4, 4.5, 4.5, 3.5, -1, 0, 0, 2, 2, 0] },
    { name = "rock", category = 11, gains = [4, 3, 3, 1, 0, -1, 0, 1, 2, 4] },
    { name = "funk", category = 12, gains = [5, 5, 5, 0, -1, 1, 0, 1, 4, 3] },
    { name = "vocal", category = 2, gains = [-1.5, -3, -3, 1, 3.5, 3.5, 3, 1.5, 0, -1.5] },
    { name = "jazz", category = 1, gains = [4, 3, 1, 2.5, -1.5, -1.5, 0, 1, 3, 4] },
]
